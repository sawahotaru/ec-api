    <path d="M88 56C111 41 144 31 180 27C219 23 270 24 333 34" stroke="url(#gold)" stroke-width="2.6" stroke-linecap="round" opacity="0.92"/>
    <path d="M89 58C113 45 145 36 177 33C210 30 254 30 309 36" stroke="#362E27" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

    <text x="104" y="34" fill="#7E5A24" font-size="13" font-weight="700" letter-spacing="0.34em" font-family="'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif">WAZAKKA</text>
    <text x="102" y="72" fill="url(#ink)" font-size="37" font-weight="700" letter-spacing="0.12em" font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif">みやび</text>
