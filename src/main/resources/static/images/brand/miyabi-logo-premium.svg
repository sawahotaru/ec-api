      <stop offset="0" stop-color="#7E5A24"/>
      <stop offset="0.5" stop-color="#C8A56A"/>
      <stop offset="1" stop-color="#8A6734"/>
    </linearGradient>
    <linearGradient id="ink" x1="120" y1="16" x2="300" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A1714"/>
      <stop offset="1" stop-color="#38312A"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="420" height="96" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

