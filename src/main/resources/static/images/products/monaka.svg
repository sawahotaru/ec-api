<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="最中">
  <defs>
    <pattern id="mdots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="2.4" fill="#c08a4a"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="#fdf6e8"/>
  <rect width="600" height="400" fill="url(#mdots)" opacity=".18"/>

  <!-- 敷紙 -->
  <path d="M84 300 L516 300 L478 356 L122 356 Z" fill="#f0e6d2"/>
  <path d="M84 300 L516 300 L512 306 L88 306 Z" fill="#e3d5ba"/>

  <!-- 奥: まるごと1個（俯瞰・菊型の皮） -->
  <g transform="translate(430 236)">
    <ellipse cx="0" cy="8" rx="92" ry="62" fill="#d8b87f"/>
    <ellipse cx="0" cy="0" rx="92" ry="62" fill="#eed9ab"/>
    <g fill="none" stroke="#d6bb87" stroke-width="3">
      <path d="M0 -60 L0 60 M-90 0 L90 0 M-64 -42 L64 42 M64 -42 L-64 42"/>
      <ellipse cx="0" cy="0" rx="46" ry="31"/>
    </g>
    <ellipse cx="0" cy="0" rx="16" ry="11" fill="#e0c48f"/>
  </g>

  <!-- 手前: 半分に割った最中（断面＝皮・餡・皮の三層） -->
  <g transform="translate(226 232)">
    <!-- 下の皮 -->
    <path d="M-124 24 Q-124 76 0 76 Q124 76 124 24 Z" fill="#e0c48f"/>
    <path d="M-124 24 Q-124 76 0 76 Q124 76 124 24 Z" fill="none" stroke="#cdae78" stroke-width="2"/>
    <!-- 餡（粒あん） -->
    <path d="M-124 24 L124 24 L124 -6 Q0 -30 -124 -6 Z" fill="#4a2b23"/>
    <path d="M-124 10 Q0 -14 124 10 L124 24 L-124 24 Z" fill="#5c372c"/>
    <g fill="#6b4133">
      <circle cx="-76" cy="12" r="5"/><circle cx="-38" cy="6" r="5.5"/>
      <circle cx="4" cy="4" r="5"/><circle cx="46" cy="7" r="5.5"/>
      <circle cx="84" cy="13" r="5"/>
    </g>
    <!-- 上の皮 -->
    <path d="M-124 -6 Q-124 -76 0 -76 Q124 -76 124 -6 Z" fill="#eed9ab"/>
    <path d="M-124 -6 Q-124 -76 0 -76 Q124 -76 124 -6 Z" fill="none" stroke="#d6bb87" stroke-width="2"/>
    <g fill="none" stroke="#dfc794" stroke-width="2.6">
      <path d="M-84 -44 Q0 -66 84 -44 M-104 -22 Q0 -46 104 -22"/>
      <path d="M0 -76 L0 -6 M-62 -66 L-62 -6 M62 -66 L62 -6"/>
    </g>
  </g>
