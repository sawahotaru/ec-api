<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>和雑貨 みやび — EC Demo Shop</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- ファビコン。パスはすべて相対にしてある（ルート "/" でも "/ec/" 配下でも同じ HTML で動く）。
         SVG を先に置くのは、対応ブラウザではどの解像度でも滲まないため。
         非対応の環境は下の PNG に落ちる。 -->
    <link rel="icon" type="image/svg+xml" href="images/brand/miyabi-favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="images/brand/favicon-32.png">
    <link rel="apple-touch-icon" href="images/brand/miyabi-favicon-192.png">
    <!-- 拡張子を .json にしてあるのは、.webmanifest だと Spring の静的配信が
         application/octet-stream で返すため（型を指定する API がこのバージョンに無い）。
         ブラウザは manifest を JSON 型でも受け付ける。 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
</head>
<body>
<header class="topbar">
    <!-- サイト名／ロゴ。中身は起動時に /api/store/branding の内容で差し替わる。
         href="#/" にしてあるので、JS が落ちてもホームには戻れる。 -->
    <a class="brand" id="brand" href="#/" aria-label="ホームへ">和雑貨 みやび</a>
    <div class="search">
        <input id="search" type="search" placeholder="商品名で検索…" autocomplete="off">
        <select id="category"><option value="">全カテゴリ</option></select>
    </div>
    <div class="account">
        <span id="userLabel" class="user-label hidden"></span>
        <button id="adminBtn" class="btn ghost hidden">⚙️ 管理</button>
        <button id="ordersBtn" class="btn ghost hidden">注文履歴</button>
        <button id="guestOrdersBtn" class="btn ghost">🔎 注文照会</button>
        <button id="cartBtn" class="btn ghost">🛒 <span id="cartCount">0</span></button>
        <button id="authBtn" class="btn">ログイン</button>
        <button id="logoutBtn" class="btn ghost hidden">ログアウト</button>
    </div>
</header>

<main>
    <div id="banner" class="banner hidden"></div>
    <section id="grid" class="grid" aria-live="polite"></section>
    <div id="emptyState" class="empty hidden">該当する商品がありません。</div>
    <!-- 商品詳細ページ（#/product/{id} でグリッドと切替） -->
    <section id="productDetail" class="detail hidden" aria-live="polite"></section>
    <!-- 管理パネル（#/admin・ADMINロールのみ） -->
    <section id="adminPanel" class="admin hidden" aria-live="polite"></section>
    <!-- ゲスト注文の照会（#/orders/guest・ログイン不要） -->
    <section id="guestOrders" class="lookup hidden" aria-live="polite"></section>
</main>

<!-- Cart drawer -->
<aside id="cartDrawer" class="drawer hidden" aria-label="カート">
    <div class="drawer-head">
        <h2>カート</h2>
        <button class="btn ghost" data-close="cart">✕</button>
    </div>
    <div id="cartItems" class="drawer-body"></div>
    <div class="drawer-foot">
        <!-- クーポン。サーバーの見積もりAPIで検証するので、ここで通れば注文でも通る -->
        <div id="couponRow" class="coupon-row hidden">
            <input id="couponInput" type="text" placeholder="クーポンコード" autocomplete="off" spellcheck="false">
            <button id="couponApplyBtn" class="btn ghost sm" type="button">適用</button>
        </div>
        <p id="couponState" class="coupon-state hidden"></p>
        <!-- 金額内訳（小計 / 割引 / 送料 / 消費税）。サーバーの見積もりをそのまま出す -->
        <div id="cartTax" class="tax-breakdown hidden"></div>
        <div class="total-row"><span id="cartTotalLabel">合計</span><strong id="cartTotal">¥0</strong></div>
        <p id="cartTaxNote" class="hint hidden" style="margin:0 0 8px"></p>
        <!-- 未ログイン時: 会員購入 / ゲスト購入 を選択（購入方法の分岐） -->
        <div id="guestChoice" class="guest-choice hidden">
            <p class="hint">購入方法を選択してください</p>
            <button id="chooseMemberBtn" class="btn wide">🔐 ログインして購入（会員）</button>
            <button id="chooseGuestBtn" class="btn wide ghost">🛒 ゲストとして購入（登録不要）</button>
        </div>
        <label id="guestEmailField" class="field hidden">
            <span>メールアドレス（ゲスト購入）</span>
            <input id="guestEmail" type="email" placeholder="you@example.com" autocomplete="email">
        </label>
        <button id="checkoutBtn" class="btn wide" disabled>注文を確定する</button>
        <button id="guestBackBtn" class="linklike hidden" type="button">← 購入方法を選び直す</button>
        <p id="guestHint" class="hint hidden">ログインなしで購入できます。注文後に照会用トークンを表示します。</p>
    </div>
</aside>

<!-- Orders drawer -->
<aside id="ordersDrawer" class="drawer hidden" aria-label="注文履歴">
    <div class="drawer-head">
        <h2>注文履歴</h2>
        <button class="btn ghost" data-close="orders">✕</button>
    </div>
    <div id="ordersBody" class="drawer-body"></div>
</aside>

<div id="scrim" class="scrim hidden"></div>

<!-- Auth modal -->
<div id="authModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
        <div class="tabs">
            <button class="tab active" data-tab="login">ログイン</button>
            <button class="tab" data-tab="register">新規登録</button>
        </div>
        <form id="authForm">
            <label id="nameField" class="field hidden">
                <span>お名前</span>
                <input id="f-name" type="text" autocomplete="name">
            </label>
            <label class="field">
                <span>メールアドレス</span>
                <input id="f-email" type="email" required autocomplete="email">
            </label>
            <label class="field">
                <span>パスワード</span>
                <input id="f-password" type="password" required minlength="6" autocomplete="current-password">
            </label>
            <p id="authError" class="error hidden"></p>
            <button type="submit" class="btn wide" id="authSubmit">ログイン</button>
            <p class="hint">デモ: <code>user@example.com</code> / <code>user1234</code></p>
        </form>
        <!-- 二段階目。パスワードが通っただけでは、まだトークンを受け取っていない -->
        <form id="mfaStep" class="hidden">
            <h3 class="mfa-title">🔐 二段階認証</h3>
            <p class="hint">認証アプリに表示されている6桁の数字を入力してください。</p>
            <label class="field">
                <span>認証コード</span>
                <input id="f-mfa-code" type="text" inputmode="numeric" autocomplete="one-time-code"
                       placeholder="123456" required>
            </label>
            <p id="mfaError" class="error hidden"></p>
            <button type="submit" class="btn wide">確認</button>
            <p class="hint">端末を失くした場合は、控えておいた<strong>リカバリコード</strong>を入力してください。</p>
        </form>
        <button class="btn ghost close-x" data-close="auth">✕</button>
    </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/app.js"></script>
</body>
</html>
