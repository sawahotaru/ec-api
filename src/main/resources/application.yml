spring:
  application:
    name: ec-api

  # Default profile uses in-memory H2 so the app boots with zero setup.
  # Production / docker-compose activate the "postgres" profile via SPRING_PROFILES_ACTIVE.
  datasource:
    url: jdbc:h2:mem:ecapi;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # スキーマは Flyway が正（src/main/resources/db/migration）。
  # 既存DB（本番VM・ローカル）は ddl-auto=update が作った状態なので、V1 は実行せず
  # 「適用済み」として記録する（baseline-on-migrate）。空DB では V1 から順に流れる。
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      # Hibernate はもうスキーマを変更しない。エンティティと実スキーマがずれていたら
      # 起動時に落とす（マイグレーションの書き忘れをここで検出する）。
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true

  servlet:
    multipart:
      # 商品画像アップロードの上限。ここは「バッファに載せる前に container が弾く」段で、
      # app.uploads.max-bytes はアプリ側の同じ上限（両方に置くのは、この class が
      # multipart 以外から呼ばれても上限が消えないようにするため）。
      max-file-size: ${APP_UPLOADS_MAX_SIZE:2MB}
      max-request-size: ${APP_UPLOADS_MAX_SIZE:2MB}

app:
  # 店舗フロントの公開URL（末尾スラッシュ不要。VM では context-path を含めて "/ec" まで）。
  # メール等の外向き通知に載せる絶対リンクの組み立てに使う。未設定でも動くが、
  # ゲスト注文メールは直リンクの代わりに注文番号＋トークンの手入力案内になる。
  public-base-url: ${PUBLIC_BASE_URL:}
  uploads:
    # 管理画面から上げた商品画像の置き場。jar の外＝再デプロイで消えないよう、
    # 本番(VM)では compose のボリュームを指す。作成できない/読み取り専用なら
    # アップロードだけが 503 になり、他の機能はそのまま動く。
    dir: ${APP_UPLOADS_DIR:./data/uploads}
    # 1ファイルの上限（バイト）。spring.servlet.multipart 側と揃える。
    max-bytes: ${APP_UPLOADS_MAX_BYTES:2097152}
  demo:
    # 「公開デモである」ことに由来する制限。**3つとも既定は無効**（配布物として持ち出した人の
    # 環境で、説明も無く管理機能が使えないのは機能欠陥にしか見えない）。
    # 管理画面を隠すのではなく「壊す価値・盗む価値を置かない」方向で守る設計。
    #   read-only    : /api/admin/** への書き込み（POST/PUT/PATCH/DELETE）を 403
    #   mask-contact : 管理画面の応答で連絡先メールを伏せ字にする（本人の照会は伏せない）
    #   retention-days: 何日経った注文の連絡先を消すか。0 なら消さない。
    #                  ⚠ 注文自体は消さない（消すと売上集計から過去が消える）
    read-only: ${APP_DEMO_READ_ONLY:false}
    mask-contact: ${APP_DEMO_MASK_CONTACT:false}
    retention-days: ${APP_DEMO_RETENTION_DAYS:0}
    retention-sweep-ms: ${APP_DEMO_RETENTION_SWEEP_MS:3600000}
  auth:
    # ログイン総当たり対策。メールアドレス単位で数える（IP は詐称できるため）。
    # 成功すれば即リセットされる。
    max-login-attempts: ${APP_MAX_LOGIN_ATTEMPTS:5}
    login-window-seconds: ${APP_LOGIN_WINDOW_SECONDS:900}
    login-lockout-seconds: ${APP_LOGIN_LOCKOUT_SECONDS:900}
  jwt:
    # Overridden by APP_JWT_SECRET in production. Must be >= 32 bytes for HS256.
    secret: ${APP_JWT_SECRET:change-me-in-production-please-32bytes-minimum-secret}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
    # 二段階目の引換券の寿命。短いのは、パスワードだけが漏れた状態で
    # 長く持ち歩けるものを渡さないため。これでは何のAPIも叩けない（purpose=mfa）。
    mfa-expiration-ms: ${APP_JWT_MFA_EXPIRATION_MS:300000}
  seed:
    # Seed demo data (categories, products, admin + demo user) on startup.
    enabled: ${APP_SEED_ENABLED:true}
    admin-email: ${APP_ADMIN_EMAIL:admin@example.com}
    admin-password: ${APP_ADMIN_PASSWORD:admin1234}
  mfa:
    # 認証アプリに表示される発行者名（otpauth URI の issuer）。
    issuer: ${APP_MFA_ISSUER:EC API}
  order:
    # A checkout reserves (holds) stock. If unpaid within this window, a background
    # sweep expires the order and releases the hold back to sellable stock.
    hold-minutes: ${APP_ORDER_HOLD_MINUTES:30}
    expiry-sweep-ms: ${APP_ORDER_EXPIRY_SWEEP_MS:60000}
  tax:
    # INCLUSIVE=内税(price は税込・総額表示) / EXCLUSIVE=外税(price は税抜・税を加算)。
    # 現在は内税を運用。税率は effective-dated な tax_rates テーブルで管理し、注文時に凍結する。
    pricing-mode: ${APP_TAX_PRICING_MODE:INCLUSIVE}
    # 端数処理: FLOOR=切り捨て(JP小売で一般的) / HALF_UP=四捨五入 / CEILING=切り上げ。
    rounding: ${APP_TAX_ROUNDING:FLOOR}
  shipping:
    # 送料の**初期値**。一度でも管理画面から保存されたら以後はDBの値が優先される
    # （税の内税/外税と同じ扱い）。金額は商品価格と同じ流儀で読む。
    fee: ${APP_SHIPPING_FEE:0}
    # これ以上（割引後の商品合計）で送料無料。0 なら無料にはならない。
    free-threshold: ${APP_SHIPPING_FREE_THRESHOLD:0}
  payment:
    # 決済手段によらない共通設定。決済手段そのものは PaymentProvider の実装として
    # 追加され、有効化された実装だけが /api/payments/config に現れる。
    currency: ${PAYMENT_CURRENCY:${STRIPE_CURRENCY:jpy}}
    # 決済手段が指定されなかったときに使う id。従来どおり Stripe を既定にしておく
    # （無効なら有効な手段へ自動フォールバック。空欄なら「有効なうち最初の1つ」）。
    default-provider: ${PAYMENT_DEFAULT_PROVIDER:stripe}
    bank-transfer:
      # 外部APIもWebhookも持たない決済手段の例。入金確認は管理画面から PAID にして行う。
      enabled: ${BANK_TRANSFER_ENABLED:false}
      account-info: ${BANK_TRANSFER_ACCOUNT:〇〇銀行 〇〇支店 普通 1234567 カ）サンプルストア}
      note-days: ${BANK_TRANSFER_NOTE_DAYS:3}
  stripe:
    # TEST MODE ONLY. Leave blank to disable payments (app still boots).
    # Set sk_test_... and whsec_... in production env (never commit real keys).
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:8502/api/payments/success}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:8502/api/payments/cancel}
  notify:
    mail:
      # 注文イベント → メール通知プラグイン。既定は無効（デモ環境で誤送信しないため）。
      # 有効にする場合は spring.mail.host 等の SMTP 設定も必要。
      enabled: ${NOTIFY_MAIL_ENABLED:false}
      from: ${NOTIFY_MAIL_FROM:no-reply@example.com}
      # 空でなければ受注通知を管理者にも送る。
      admin: ${NOTIFY_MAIL_ADMIN:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${PORT:8080}
  # リバースプロキシ配下では X-Forwarded-Proto/Host を尊重して自分のURLを組み立てる。
  # これが none（既定）だと、HTTPS で配信していても Swagger の "Servers" が
  # http://… になり、HTTPS のページからの Try it out が混在コンテンツとして
  # ブラウザにブロックされる（本番 /ec/ で実際に踏んだ）。
  #
  # ⚠️ 既定は none のまま。転送ヘッダは詐称できるので、アプリに直接届く経路がある
  #    構成で有効にしてはいけない。VM では ec-api はポートを公開せず Caddy 経由でしか
  #    到達できないため framework を渡している。
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  # Empty locally (served at "/"); set to "/ec" on the Oracle VM so the app
  # lives at lab.4510.be/ec/ alongside clinic at /clinic-reservation/.
  servlet:
    context-path: ${APP_CONTEXT_PATH:}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  h2:
    console:
      enabled: false
