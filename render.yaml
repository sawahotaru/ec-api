# Render Blueprint: web service (Docker) + managed PostgreSQL.
# Deploy: push this repo to GitHub, then in Render "New +" -> "Blueprint" and pick the repo.
services:
  - type: web
    name: ec-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      # Render injects the DB connection pieces from the database below.
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: ec-api-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: ec-api-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: ec-api-db
          property: password
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_SEED_ENABLED
        value: "true"
      # Change these after first deploy, or set your own before deploying.
      - key: APP_ADMIN_EMAIL
        value: admin@example.com
      - key: APP_ADMIN_PASSWORD
        sync: false

databases:
  - name: ec-api-db
    plan: free
    databaseName: ecapi
    user: ecapi
